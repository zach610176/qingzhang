<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>轻账</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="本地记账，数据只存在你的手机上。">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="轻账">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<link rel="icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- 启动闪屏 -->
<div id="boot" class="boot">
  <div class="boot-logo">轻账</div>
  <div class="boot-sub">数据只存在这台手机上</div>
  <div class="boot-bar"><i></i></div>
</div>

<!-- 应用主体 -->
<div id="app" class="app" hidden>

  <header class="nav" id="nav">
    <button class="nav-side" id="nav-left" type="button" aria-label="上一个月"></button>
    <button class="nav-title" id="nav-title" type="button">
      <span id="nav-title-text">本月</span>
      <svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-side" id="nav-right" type="button" aria-label="下一个月"></button>
  </header>

  <main class="screens" id="screens">

    <!-- ============ 首页 ============ -->
    <section class="screen" id="screen-home" data-tab="home">
      <div id="home-body"></div>
    </section>

    <!-- ============ 明细 ============ -->
    <section class="screen" id="screen-detail" data-tab="detail" hidden>
      <div id="detail-body"></div>
    </section>

    <!-- ============ 统计 ============ -->
    <section class="screen" id="screen-stats" data-tab="stats" hidden>
      <div id="stats-body"></div>
    </section>

    <!-- ============ 预算 ============ -->
    <section class="screen" id="screen-budget" data-tab="budget" hidden>
      <div id="budget-body"></div>
    </section>

    <!-- ============ 攒钱 ============ -->
    <section class="screen" id="screen-savings" data-tab="savings" hidden>
      <div id="savings-body"></div>
    </section>

    <!-- ============ 设置 ============ -->
    <section class="screen" id="screen-settings" data-tab="settings" hidden>
      <div id="settings-body"></div>
    </section>

  </main>

  <!-- 底部标签栏 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-tab="detail" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>明细</span>
    </button>
    <button class="tab tab-add" id="tab-add" type="button" aria-label="记一笔">
      <span class="plus">＋</span>
    </button>
    <button class="tab" data-tab="stats" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V4M19 20v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>统计</span>
    </button>
    <button class="tab" data-tab="settings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>我的</span>
    </button>
  </nav>

</div>

<!-- 弹层容器 -->
<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<!-- 隐藏的文件选择器 -->
<input type="file" id="file-input" accept=".csv,.txt,.zip,.xlsx" multiple hidden>
<input type="file" id="backup-input" accept=".qzbak,.txt,.json" hidden>

<!-- 兼容性提示 -->
<noscript><div class="fatal">轻账需要 JavaScript 才能运行，请在 Safari 里打开。</div></noscript>
<div id="fatal" class="fatal" hidden></div>

<!--
  看门狗：专门对付「打不开」这种情况。

  为什么需要它：启动脚本是 `import { boot } from './src/ui/app.js'`。
  如果那一行 import **本身**失败（离线缓存里少了一个文件、或者存到了坏副本），
  整个 module 脚本会直接失败 —— 后面的 .catch() 根本不会被调用，
  用户看到的就是**一片空白，没有任何提示**，只能干瞪眼。

  这里用一个普通的（非 module）脚本盯着：
    · 6 秒内应用没启动起来 → 显示明确的错误 + 一个「重新加载」按钮
    · 「重新加载」会带一个随机参数，绕过 Service Worker 的缓存重新取文件
  普通脚本不会因为 module 加载失败而受影响，所以它一定能执行到。
-->
<script>
(function () {
  /*
    超时时间。
    以前是 6 秒 —— 太急了：线上（GitHub Pages + 慢网络）第一次安装缓存
    实测要 16 秒左右，于是正常启动也会被误判成「卡住」，
    平白弹出一个「轻账没能打开」把用户吓一跳。
    现在放宽到 15 秒；真卡住的话多等几秒也能接受，总比误报好。
  */
  var BOOT_TIMEOUT = 15000;
  var settled = false;

  function showRecovery(reason) {
    if (settled) return;
    settled = true;
    var boot = document.getElementById('boot');
    var fatal = document.getElementById('fatal');
    if (boot) boot.hidden = true;
    if (!fatal) return;
    fatal.hidden = false;
    fatal.innerHTML =
      '<div class="fatal-title">轻账没能打开</div>'
      + '<div class="fatal-msg">'
      + (reason || '可能是本地缓存的文件出了问题。')
      + '<br>点下面的按钮重新获取文件，多半就能好。</div>'
      + '<button type="button" id="qz-retry" class="fatal-retry">重新加载</button>'
      + '<div class="fatal-hint">'
      + '如果点了还是打不开：把轻账从后台完全关掉（底部上滑停住 → 卡片上划掉），再点桌面图标重开一次。'
      + '<br><br>注意：<b>不要</b>在 Safari 设置里「清除网站数据」——那会把你的记账数据一起删掉。</div>';

    var btn = document.getElementById('qz-retry');
    if (btn) {
      btn.addEventListener('click', function () {
        // 带一个每次都不同的参数，并留一个标记告诉应用
        // 「这次启动要先把缓存整体刷一遍」（见 src/ui/app.js）。
        // 不带这个标记的话，静态资源还是从缓存拿，可能还是那个坏文件。
        try { sessionStorage.setItem('qz-force-network', '1'); } catch (e) { /* 忽略 */ }
        var url = location.origin + location.pathname + '?r=' + Date.now();
        location.replace(url);
      });
    }
  }

  // 应用启动成功后会设这个标记
  window.__qzBooted = false;

  setTimeout(function () {
    if (!window.__qzBooted) showRecovery('加载超时了（等了 ' + (BOOT_TIMEOUT / 1000) + ' 秒）。');
  }, BOOT_TIMEOUT);

  // module 脚本加载失败（最常见的就是缓存里缺文件）→ 立刻提示，不用等超时
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t.tagName === 'SCRIPT') {
      showRecovery('启动文件没加载成功。');
    }
  }, true);

  // 兜底：任何未捕获错误
  window.addEventListener('unhandledrejection', function () {
    setTimeout(function () { if (!window.__qzBooted) showRecovery('启动时出错了。'); }, 2000);
  });
})();
</script>

<script type="module">
  /*
    启动入口。
    优先用合并后的单文件 src/bundle.js —— 它把 33 个模块合成 1 个请求，
    冷启动快很多（实测线上第一次打开要 4 秒，主要是 33 个文件排队下载）。
    bundle.js 由 tools/build-bundle.mjs 生成；本地开发时如果没有这个文件，
    就自动退回按模块加载（和以前一样）。
  */
  let mod = null;
  try { mod = await import('./src/bundle.js'); } catch (e) { /* 没有合并文件 */ }
  if (!mod) mod = await import('./src/ui/app.js');
  mod.boot().then(function () {
    window.__qzBooted = true;
  }).catch(function (err) {
    window.__qzBooted = true; // 已经显示出错了，别再触发看门狗
    const el = document.getElementById('fatal');
    el.hidden = false;
    el.textContent = '轻账启动失败：' + (err && err.message ? err.message : String(err));
    const b = document.getElementById('boot');
    if (b) b.hidden = true;
    console.error(err);
  });
</script>
</body>
</html>
