<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>轻账</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="本地记账，数据只存在你的手机上。">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="轻账">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<link rel="icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- 启动闪屏 -->
<div id="boot" class="boot">
  <div class="boot-logo">轻账</div>
  <div class="boot-sub">数据只存在这台手机上</div>
  <div class="boot-bar"><i></i></div>
</div>

<!-- 应用主体 -->
<div id="app" class="app" hidden>

  <header class="nav" id="nav">
    <button class="nav-side" id="nav-left" type="button" aria-label="上一个月"></button>
    <button class="nav-title" id="nav-title" type="button">
      <span id="nav-title-text">本月</span>
      <svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-side" id="nav-right" type="button" aria-label="下一个月"></button>
  </header>

  <main class="screens" id="screens">

    <!-- ============ 首页 ============ -->
    <section class="screen" id="screen-home" data-tab="home">
      <div id="home-body"></div>
    </section>

    <!-- ============ 明细 ============ -->
    <section class="screen" id="screen-detail" data-tab="detail" hidden>
      <div id="detail-body"></div>
    </section>

    <!-- ============ 统计 ============ -->
    <section class="screen" id="screen-stats" data-tab="stats" hidden>
      <div id="stats-body"></div>
    </section>

    <!-- ============ 预算 ============ -->
    <section class="screen" id="screen-budget" data-tab="budget" hidden>
      <div id="budget-body"></div>
    </section>

    <!-- ============ 攒钱 ============ -->
    <section class="screen" id="screen-savings" data-tab="savings" hidden>
      <div id="savings-body"></div>
    </section>

    <!-- ============ 设置 ============ -->
    <section class="screen" id="screen-settings" data-tab="settings" hidden>
      <div id="settings-body"></div>
    </section>

  </main>

  <!-- 底部标签栏 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-tab="detail" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>明细</span>
    </button>
    <button class="tab tab-add" id="tab-add" type="button" aria-label="记一笔">
      <span class="plus">＋</span>
    </button>
    <button class="tab" data-tab="stats" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V4M19 20v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>统计</span>
    </button>
    <button class="tab" data-tab="settings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>我的</span>
    </button>
  </nav>

</div>

<!-- 弹层容器 -->
<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<!-- 隐藏的文件选择器 -->
<input type="file" id="file-input" accept=".csv,.txt,.zip,.xlsx" multiple hidden>
<input type="file" id="backup-input" accept=".qzbak,.txt,.json" hidden>

<!-- 兼容性提示 -->
<noscript><div class="fatal">轻账需要 JavaScript 才能运行，请在 Safari 里打开。</div></noscript>
<div id="fatal" class="fatal" hidden></div>

<script type="module">
  import { boot } from './src/ui/app.js';
  boot().catch((err) => {
    const el = document.getElementById('fatal');
    el.hidden = false;
    el.textContent = '轻账启动失败：' + (err && err.message ? err.message : String(err));
    const b = document.getElementById('boot');
    if (b) b.hidden = true;
    console.error(err);
  });
</script>
</body>
</html>
